spring.application.name=reservation

server.port=8080

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/reservation-sample?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=username
spring.datasource.password=password

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.sample.reservation.dto
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.sample.reservation.mapper=DEBUG